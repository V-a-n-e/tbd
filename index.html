
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveAware Audio Player</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            color: #333;
        }

        .audio-container {
            background: white;
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h3 {
            margin-bottom: 15px;
        }

        audio {
            width: 100%;
        }
    </style>
</head>

<body>

    <h1>DriveAware Audio Player</h1>
    <p>Select an audio recording to play.</p>

    <div class="audio-container">
        <h3>S01</h3>
        <audio controls>
            <source src="S01.m4a" type="audio/mp4">
        </audio>
    </div>

    <div class="audio-container">
        <h3>S02</h3>
        <audio controls>
            <source src="S02.m4a" type="audio/mp4">
        </audio>
    </div>

    <div class="audio-container">
        <h3>S03</h3>
        <audio controls>
            <source src="S03.m4a" type="audio/mp4">
        </audio>
    </div>

    <div class="audio-container">
        <h3>S04</h3>
        <audio controls>
            <source src="S04.m4a" type="audio/mp4">
        </audio>
    </div>

</body>
</html>
